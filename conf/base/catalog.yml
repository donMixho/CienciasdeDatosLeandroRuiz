# CAPA 01_RAW: Datos originales (utf-8, así vienen)
empleados:
  type: pandas.CSVDataset
  filepath: data/01_raw/empleados.csv
  load_args:
    encoding: utf-8

evaluaciones:
  type: pandas.CSVDataset
  filepath: data/01_raw/evaluaciones.csv
  load_args:
    encoding: utf-8

capacitaciones:
  type: pandas.CSVDataset
  filepath: data/01_raw/capacitaciones.csv
  load_args:
    encoding: utf-8

ausencias:
  type: pandas.CSVDataset
  filepath: data/01_raw/ausencias.csv
  load_args:
    encoding: utf-8

# CAPA 02_INTERMEDIATE: Datos limpios (latin-1 para evitar errores en Windows)
empleados_clean:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/empleados_clean.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1

evaluaciones_clean:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/evaluaciones_clean.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1

capacitaciones_clean:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/capacitaciones_clean.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1

ausencias_clean:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/ausencias_clean.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1

# CAPA 03_PRIMARY: Datos integrados
dataset_final_integrado:
  type: pandas.CSVDataset
  filepath: data/03_primary/dataset_final_integrado.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1

