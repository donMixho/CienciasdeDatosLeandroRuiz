# CAPA 01_RAW: Datos originales (Pipeline 1)
empleados:
  type: pandas.CSVDataset
  filepath: data/01_raw/empleados.csv
  load_args:
    encoding: latin-1

evaluaciones:
  type: pandas.CSVDataset
  filepath: data/01_raw/evaluaciones.csv
  load_args:
    encoding: latin-1

capacitaciones:
  type: pandas.CSVDataset
  filepath: data/01_raw/capacitaciones.csv
  load_args:
    encoding: latin-1

ausencias:
  type: pandas.CSVDataset
  filepath: data/01_raw/ausencias.csv
  load_args:
    encoding: latin-1

# CAPA 02_INTERMEDIATE: Datos limpios (Pipeline 2)
empleados_clean:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/empleados_clean.csv
  load_args:
    encoding: utf-8-sig
  save_args:
    index: false
    encoding: utf-8-sig

evaluaciones_clean:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/evaluaciones_clean.csv
  load_args:
    encoding: utf-8-sig
  save_args:
    index: false
    encoding: utf-8-sig

capacitaciones_clean:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/capacitaciones_clean.csv
  load_args:
    encoding: utf-8-sig
  save_args:
    index: false
    encoding: utf-8-sig

ausencias_clean:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/ausencias_clean.csv
  load_args:
    encoding: utf-8-sig
  save_args:
    index: false
    encoding: utf-8-sig

# CAPA 03_PRIMARY: Datos integrados y transformados (Pipeline 3)
dataset_final_integrado:
  type: pandas.CSVDataset
  filepath: data/03_primary/dataset_final_integrado.csv
  load_args:
    encoding: utf-8-sig
  save_args:
    index: false
    encoding: utf-8-sig-sig

# CAPA 08_REPORTING: Reportes (Pipeline 1 y 4)
reporte_diagnostico:
  type: pandas.CSVDataset
  filepath: data/08_reporting/reporte_diagnostico.csv
  save_args:
    index: false
    encoding: utf-8-sig

reporte_comparacion:
  type: pandas.CSVDataset
  filepath: data/08_reporting/reporte_comparacion.csv
  save_args:
    index: false
    encoding: utf-8-sig

reporte_validacion_final:
  type: pandas.CSVDataset
  filepath: data/08_reporting/reporte_validacion_final.csv
  save_args:
    index: false
    encoding: utf-8-sig
